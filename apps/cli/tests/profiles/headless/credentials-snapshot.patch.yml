# Missing-credential patch over the shipped headless profile. The adapter
# serves the production route but cannot reach its endpoint; a patch replaces
# the row's whole config, so the route's profile is restated here.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      deepseek-official:
        displayName: DeepSeek
        apiKeyEnv: DEEPSEEK_API_KEY
        api: anthropic-messages
        baseURL: 'http://127.0.0.1:9'
        reasoning: high
        adaptiveThinkingType: enabled
        compat:
          forceAdaptiveThinking: true
          allowEmptySignature: true
        models:
          - id: deepseek-flash
            name: DeepSeek-V41-Flash
            contextWindow: 1000000
            maxTokens: 256000
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
            systemPromptUpdate: in-history
            toolUpdate: in-history

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

# The bake-tui-app patch: the interactive terminal surface over a base-backed
# profile. Applied after the profile's own bundle layers, so rows here override
# theirs by id, with the profile patch and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below restates
# every key it owns.

# The one-shot runner owns stdout and exits after a single task. A terminal
# session cannot share a process with it.
- id: headless-runner
  disabled: true
- id: headless-startup
  disabled: true

# Every terminal session is composed from an agent preset, and each preset
# that offers background jobs mounts its own `tool-jobs`. The base row would
# add a host-scope completion listener that reaches every preset agent too,
# so each finished job would notify the model twice, and it would let a preset
# without job controls start background work.
- id: tool-jobs
  disabled: true

# Each preset that compacts mounts its own `compaction-basic`. The base row's
# automatic listeners, the between-step pressure check and context-overflow
# recovery, reach every preset agent too, so two engines would check each step
# and the lower threshold would win, and `minimal`, whose preset leaves
# compaction out, would compact anyway. `auto: false` removes both listeners
# and keeps the engine for the host `/compact`, which serves a preset without
# its own command. A later layer that configures this row replaces this config,
# so it must keep `auto: false`.
- id: compaction-basic
  config:
    auto: false

# Bound newly produced previews; persisted results keep their original bytes.
- id: spill-policy
  config:
    maxInlineBytes: 16384

# The agent's own rows belong to its preset: instructions, the shells, file
# tools, skills, goal controls, delegation, and web tools. The base copies
# would run on the host plane, where their global tools and untagged listeners
# reach every preset agent as well. A preset that mounts the same row then runs
# it twice: the host `tool-skill` finds none of the preset's skills, strips the
# preset's catalog, and injects each `/skill` body a second time. A preset that
# leaves a row out gets the host copy anyway: the shell-only `minimal` would
# receive every tool here, AGENTS.md, and the skill catalog. The services behind these tools stay on the host: the
# `skill` registry, the `goal` service and its round driver, and the
# `subagent` registry and backends. The compaction rows above stay too, for
# the host `/compact`.
- id: agent-instructions
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-web
  disabled: true

# Bake's preset persona owns the identity, so the harness opener stays out.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false

- insert:
    - id: file-reference-local
      name: 'bake-file-reference-local'

    # The `cordisInspect` registry that the `cordis` preset's inspection tools
    # register into and query. It is one registry for the whole process, so it
    # sits on the host plane rather than in the preset. It adds no tool or
    # prompt, so other presets see nothing of it.
    - id: cordis-host-runner
      name: 'bake-cordis-host-runner'

    # Agent presets, so the session mounts `standard` — this profile's own
    # roster. Not a base row. `default` names the preset the runner mounts
    # when --preset is absent; the runner reads it as `presets.defaultId`
    # rather than repeating the name.
    #
    # `cmdlineArgs` needs no row: the launcher provides it, which is why the
    # headless bundle also injects it without inserting a provider.
    - id: agent-presets
      name: 'bake-agent-presets'
      config:
        default: standard

    # The `standard` preset's subagent row requires this settings plugin in
    # the Host scope.
    - id: subagent-model-selection-settings
      name: 'bake-tool-subagent/model-selection-settings'

    # The authorization seam: `llm-pi-ai` registers one sign-in flow per
    # provider pi-ai ships a login for (OAuth or an interactive key prompt),
    # and `/login` runs them. The credential it stores needs `credentials`.
    - id: authorization
      name: 'bake-authorization'

    # argv → ctx.tuiStartup, before the runner resolves its lazy config.
    - id: tui-startup
      name: ./src/startup.ts

    # The terminal surface. `inject` makes Loader resolve the `!!js`
    # expressions below only after tui-startup provides the service.
    - id: tui-runner
      name: ./src/index.ts
      inject:
        - tuiStartup
      config:
        resume: !!js ctx.tuiStartup.resume
        preset: !!js ctx.tuiStartup.preset
        screen: !!js ctx.tuiStartup.screen
        # The composition knows which providers it mounted; the surface does
        # not. `llm-pi-ai`'s `deepseek-official` route reads this reference
        # (its `apiKeyEnv`), so `/login` can set it; `provider` is the route it unlocks, which a
        # first sign-in selects. A patch adding another provider adds its
        # reference here.
        credentialRefs:
          - ref: DEEPSEEK_API_KEY
            label: DeepSeek
            provider: deepseek-official
            model: deepseek-flash
        # The sign-ins `/login` offers, by the credential record each writes.
        # A subscription sign-in first; each also takes an API key. Signing in
        # adds the provider's route, so its models reach /model at once, and a
        # session that had no model starts on `model`.
        signInFlows:
          - key: llm-pi-ai/openai
            model: gpt-5.5
          - key: llm-pi-ai/anthropic
            model: claude-opus-4-8
          - key: llm-pi-ai/github-copilot
            model: gpt-5.4
          - key: llm-pi-ai/openrouter
            model: moonshotai/kimi-k2.6
          - key: llm-pi-ai/kimi-coding
            model: kimi-for-coding
          - key: llm-pi-ai/xai
            model: grok-4.7

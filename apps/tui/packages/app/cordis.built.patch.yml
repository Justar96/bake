# The terminal bundle applied after dsh-base by the shipped tui profile.
# Build with `bun run build` before starting the Node launcher.

# Presets mount their own `tool-jobs`; the host row would notify twice.
- id: tool-jobs
  disabled: true

# Presets mount their own `compaction-basic`; the host row's automatic
# listeners would reach every preset agent, `minimal` included. It stays
# manual-only for the host `/compact`.
- id: compaction-basic
  config:
    auto: false

# Bound newly produced previews; persisted results keep their original bytes.
- id: spill-policy
  config:
    maxInlineBytes: 16384

# Presets mount the agent's own rows. A host copy would reach every preset
# agent: doubled where the preset mounts the row too (the skill catalog and
# `/skill` bodies), leaked where it leaves the row out (`ptc`'s `workflow`,
# every tool here for the shell-only `minimal`). Their services stay on the
# host, as does the compaction trio for `/compact`.
- id: agent-instructions
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc-runtime
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Bake's preset persona owns the identity, so the harness opener stays out.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false

- insert:
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # The process-wide `cordisInspect` registry the `cordis` preset's tools use.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # The authorization seam: `llm-pi-ai` registers one sign-in flow per
    # provider pi-ai ships a login for (OAuth or an interactive key prompt),
    # and `/login` runs them. The credential it stores needs `credentials`.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: tui-startup
      name: ./lib/startup.js

    - id: tui-runner
      name: ./lib/index.js
      inject:
        - tuiStartup
      config:
        resume: !!js ctx.tuiStartup.resume
        preset: !!js ctx.tuiStartup.preset
        screen: !!js ctx.tuiStartup.screen
        credentialRefs:
          - ref: DEEPSEEK_API_KEY
            label: DeepSeek
            provider: deepseek-official
            model: deepseek-flash
        # The sign-ins `/login` offers, by the credential record each writes.
        # A subscription sign-in first; each also takes an API key. Signing in
        # adds the provider's route, so its models reach /model at once, and a
        # session that had no model starts on `model`.
        signInFlows:
          - key: llm-pi-ai/openai
            model: gpt-5.5
          - key: llm-pi-ai/anthropic
            model: claude-opus-4-8
          - key: llm-pi-ai/github-copilot
            model: gpt-5.4
          - key: llm-pi-ai/openrouter
            model: moonshotai/kimi-k2.6
          - key: llm-pi-ai/kimi-coding
            model: kimi-for-coding
          - key: llm-pi-ai/xai
            model: grok-4.7

name: Rust quality

on:
  workflow_dispatch:
    inputs:
      package:
        description: Rust package to mutation-test
        type: string
        default: bake-update
      fuzz-target:
        description: Fuzz target from fuzz/Cargo.toml
        type: string
        default: release_manifest
      fuzz-seconds:
        description: Seconds to fuzz the selected target
        type: number
        default: 120

permissions:
  contents: read

concurrency:
  group: bake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Enable Linux process namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install sandbox and search tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep bubblewrap
      - name: Install the pinned Rust toolchain and llvm-tools
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-mutants@27.1.0,cargo-fuzz@0.13.2
      - name: Coverage
        timeout-minutes: 60
        run: cargo llvm-cov --workspace --locked --html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: target/llvm-cov/html/
          if-no-files-found: ignore
      - name: Mutation tests
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        env:
          MUTATION_PACKAGE: ${{ inputs.package }}
        run: cargo mutants --package "$MUTATION_PACKAGE" --in-place
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-mutants
          path: mutants.out/
          if-no-files-found: ignore
      - name: Fuzz
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ inputs.fuzz-target }}
          FUZZ_SECONDS: ${{ inputs.fuzz-seconds }}
        run: |
          rustup toolchain install --no-self-update
          cargo fuzz run "$FUZZ_TARGET" -- -max_total_time="$FUZZ_SECONDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

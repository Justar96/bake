name: Bake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A merged pull request was already checked on its merge ref, and the release
# tag pushed alongside it builds and tests every platform again, so its merge
# commit on main is skipped. Direct pushes to main still run.
#
# A pull request from develop to main runs Linux alone. Every change it carries
# already ran on every platform in its own pull request, and the release tag
# after it builds and checks every platform again. Only the combination of
# those changes is new, which no earlier run has tested, so the Linux jobs stay.
#
# A pull request into the Rust 0.4.0 line, rust/0.4.0, directly or through a
# stack on it, runs the native job on every OS and TypeScript checks on Linux
# only as far as its files need. The pull request that syncs the line into
# develop runs everything. scripts/ci-scope.ts makes these choices.
jobs:
  scope:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      preflight: ${{ steps.plan.outputs.preflight }}
      rust: ${{ steps.plan.outputs.rust }}
      windows_release: ${{ steps.plan.outputs.windows_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Branch names are untrusted input, so they reach the script as variables.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/ci-scope.ts

  # TypeScript gates share the local preflight table; Rust has its own matrix.
  preflight:
    needs: scope
    if: needs.scope.outputs.preflight != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.preflight) }}
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # No package cache here: restoring Bun's (about 130 MB) costs as much as
      # the 1-8 s install it would replace on these runners.
      - run: bun install --frozen-lockfile
      # Advisories against the locked packages are reported, never gating: a
      # new advisory must not fail an unrelated change. One runner is enough.
      - name: Audit dependencies
        if: matrix.name == 'checks' && runner.os == 'Linux'
        continue-on-error: true
        run: |
          bun audit || {
            echo '::warning title=bun audit::Locked dependencies have advisories; see the Audit dependencies step'
            exit 1
          }
      # The bash tool runs in bubblewrap, which Ubuntu runners lack, and
      # AppArmor there denies it the unprivileged user namespaces it needs.
      - name: Enable the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The plugin manager installs external profile plugins with pnpm, separate
      # from Bun's workspace, and one regression test runs a real pnpm install.
      - name: Install pnpm for the plugin manager
        if: matrix.name == 'runtime'
        run: npm install --global pnpm@11
      - run: bun run preflight ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.name }}-failures-${{ matrix.os }}
          path: |
            .preflight/
            apps/tui/.smoke/
          if-no-files-found: ignore
          # Both directories are hidden, which upload-artifact skips by default.
          include-hidden-files: true

  rust:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.rust) }}
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install --no-self-update
      - run: bun run preflight --only native
      - name: Check Session lookup against the Node backend
        run: bun run test:runtime packages/session/session-persistence-jsonl/tests/lookup-conformance.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-failures-${{ matrix.os }}
          path: .preflight/
          if-no-files-found: ignore
          include-hidden-files: true

  windows-release:
    needs: scope
    if: needs.scope.outputs.windows_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Installing takes 30-80 s here, so Bun's package cache is kept between
      # runs; setup-bun caches only the executable. Bun reports where its cache
      # is, and a changed lockfile starts a new cache instead of growing an old one.
      - id: bun-cache
        shell: bash
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --prefer-offline
      - run: bun test scripts/workspace.test.ts scripts/release apps/tui/packages/app/tests/build.test.ts apps/tui/packages/app/tests/release.test.ts
      - run: bun run build
      - run: bun run test:runtime apps/cli/tests/bin.spec.ts packages/session/session-persistence-jsonl/tests/win32.spec.ts packages/session/session-persistence-jsonl/tests/lease.spec.ts packages/session/session-persistence-jsonl/tests/lease.two-process.spec.ts packages/session/session-persistence-jsonl/tests/header-conformance.spec.ts packages/session/session-persistence-jsonl/tests/log-scan-conformance.spec.ts packages/session/session-format-v2-to-v3/tests/source-event-seqs-conformance.spec.ts packages/session/session-format-v2-to-v3/tests/event-envelope-conformance.spec.ts packages/session/session-format-v2-to-v3/tests/v3-row-conformance.spec.ts packages/core/agent-loop/tests/request-derivation-conformance.spec.ts
      - run: bun run release:pack
      # A throwaway key: CI never holds the release signing key. verify-local
      # checks the manifest against it, then installs and updates through it.
      - run: bun run release:assemble --ephemeral-key
      - run: bun run release:verify-local

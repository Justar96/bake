name: Bake

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI runs only on the release pull request from develop into main, and on
# demand. Work reaches develop as direct pushes checked locally: Linux and
# macOS over SSH before every push, Windows when a Windows host is available.
# This run is the one CI check of everything a release carries, so it runs
# every job: TypeScript checks on Linux, the native job on x64 and arm64 Linux,
# Windows, and Apple Silicon macOS, and the Windows release check. Bake 0.4.0
# releases Linux alone (D47), so the arm64 Linux job is that platform's only
# CI evidence; Windows and macOS keep compiling and passing their tests.
# Developers check an Intel Mac over SSH before pushing; this run is the Apple
# Silicon check. The release tag after it builds and checks every platform
# again.
jobs:
  # TypeScript gates share the local preflight table; Rust has its own matrix.
  preflight:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: checks, args: '--full --skip runtime,native' }
          - { os: ubuntu-latest, name: runtime, args: '--full --only build,runtime' }
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # No package cache here: restoring Bun's (about 130 MB) costs as much as
      # the 1-8 s install it would replace on these runners.
      - run: bun install --frozen-lockfile
      # Advisories against the locked packages are reported, never gating: a
      # new advisory must not fail an unrelated change. One runner is enough.
      - name: Audit dependencies
        if: matrix.name == 'checks' && runner.os == 'Linux'
        continue-on-error: true
        run: |
          bun audit || {
            echo '::warning title=bun audit::Locked dependencies have advisories; see the Audit dependencies step'
            exit 1
          }
      # The bash tool runs in bubblewrap, which Ubuntu runners lack, and
      # AppArmor there denies it the unprivileged user namespaces it needs.
      - name: Enable the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The plugin manager installs external profile plugins with pnpm, separate
      # from Bun's workspace, and one regression test runs a real pnpm install.
      - name: Install pnpm for the plugin manager
        if: matrix.name == 'runtime'
        run: npm install --global pnpm@11
      - run: bun run preflight ${{ matrix.args }}
      # Step durations, including after a failure, in the run's summary page.
      - name: Summarize timings
        if: always()
        continue-on-error: true
        run: bun scripts/ci-step-summary.ts --title "${{ matrix.name }} (${{ matrix.os }})"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.name }}-failures-${{ matrix.os }}
          path: |
            .preflight/
            apps/tui/.smoke/
          if-no-files-found: ignore
          # Both directories are hidden, which upload-artifact skips by default.
          include-hidden-files: true

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cold Windows Wasmtime checks took 21.5 minutes; setup and the archive
    # check's existing nine-minute bound also need time within this job. The
    # arm64 Linux runner has no timing record yet, so it gets more than x64.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || matrix.os == 'ubuntu-24.04-arm' && 45 || 60 }}
    steps:
      - uses: actions/checkout@v4
      # Defender scans every file Cargo creates, which makes small-file I/O
      # several times slower than on the other hosts.
      - name: Exclude the workspace and temp directory from Defender
        if: runner.os == 'Windows'
        # An image without Defender has nothing to exclude.
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The process-owner tests run a real PID-1 child in an unprivileged
      # namespace; Ubuntu's AppArmor default otherwise denies its uid map.
      - name: Enable Linux process namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The native eval smoke's masking fixture calls the grep tool, which
      # runs ripgrep from PATH; Ubuntu runners do not ship it. The bash tool's
      # Linux sandbox runs in bubblewrap, which they do not ship either.
      - name: Install ripgrep and bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep bubblewrap
          bwrap --version
      # On Linux, the platform 0.4.0 releases, a sandbox backend or kernel
      # fault check that cannot run fails the job instead of skipping itself.
      - name: Require the Linux sandbox backends and kernel fault checks
        if: runner.os == 'Linux'
        run: |
          echo 'BAKE_REQUIRE_SANDBOX_BACKENDS=bwrap,landlock' >> "$GITHUB_ENV"
          echo 'BAKE_REQUIRE_KERNEL_FAULTS=1' >> "$GITHUB_ENV"
      - name: Install ripgrep and fd
        if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install --no-self-update
      # Stable rustc links through its own rust-lld by default only on x86_64.
      # On the arm64 runner the link otherwise leaves the GLIBC_2.39 need of
      # the weakly bound pidfd functions unmarked, as GNU ld does, so the
      # binary would not start below glibc 2.39 (release dry run
      # 39801454576). rust-lld marks that need weak, so every Linux build
      # links with the pinned toolchain's own rust-lld.
      - name: Link with the toolchain's rust-lld
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          gcc_ld="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/gcc-ld"
          [ -x "$gcc_ld/ld.lld" ] || { echo "The pinned toolchain ships no $gcc_ld/ld.lld" >&2; exit 1; }
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld -C link-arg=-B$gcc_ld" >> "$GITHUB_ENV"
      # Reuse dependency builds across runs; the Windows job otherwise spends
      # most of its time budget compiling the workspace twice (clippy and test).
      # Save even when a later step fails: a runner whose job fails every run,
      # as Windows did on its known PTY gaps, otherwise never saves and
      # rebuilds every dependency each time (run 39502149981: no cache found).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-on-failure: true
      - name: Install the Rust test runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # The package check generates the archive's dependency license text with
      # exactly cargo-about 0.9.2 and fails without it. It is built once per
      # runner OS and architecture, locked, and the build is cached by version.
      # The build is saved as soon as it is installed, not at the job's end,
      # so a job that fails later still keeps it.
      - name: Restore cargo-about 0.9.2
        id: cargo-about
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cargo-about-0.9.2
          key: cargo-about-0.9.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-about 0.9.2
        if: steps.cargo-about.outputs.cache-hit != 'true'
        working-directory: rust
        shell: bash
        run: cargo install cargo-about --version =0.9.2 --locked --features cli --root "$RUNNER_TEMP/cargo-about-0.9.2"
      - name: Save cargo-about 0.9.2
        if: steps.cargo-about.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cargo-about-0.9.2
          key: ${{ steps.cargo-about.outputs.cache-primary-key }}
      - name: Select cargo-about 0.9.2
        shell: bash
        run: |
          exe=$([[ $RUNNER_OS == Windows ]] && echo .exe || true)
          echo "BAKE_CARGO_ABOUT=$RUNNER_TEMP/cargo-about-0.9.2/bin/cargo-about$exe" >> "$GITHUB_ENV"
      # The installer checks run before the native gate, so a failure there
      # cannot hide their evidence.
      # install.ps1 carries its own Ed25519 verifier: run its suite under the
      # Windows PowerShell 5.1 that a plain `irm | iex` install uses, and pwsh.
      - name: Check the Windows installer under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        env:
          BAKE_TEST_PWSH: powershell.exe
        run: |
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          bun test --timeout=120000 ./scripts/release/native-install-windows.test.ts
      - name: Check the Windows installer under PowerShell 7
        if: runner.os == 'Windows'
        env:
          BAKE_TEST_PWSH: pwsh
        run: |
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          bun test --timeout=120000 ./scripts/release/native-install-windows.test.ts
      # install.sh verifies with the host's openssl where one passes its probe,
      # and otherwise with the verifier it embeds; record which openssl the
      # runner has and which path the install took. The shipped script refuses
      # macOS until 0.4.x, so on macOS the suite proves that refusal and runs
      # the install path through a copy without it, including an install with
      # BAKE_OPENSSL naming no openssl, which forces the embedded verifier
      # through real osascript, as a stock Mac does.
      - name: Check the POSIX installer and its Ed25519 verifier
        if: runner.os != 'Windows'
        run: |
          openssl version || true
          bun test --timeout=180000 ./scripts/release/native-install.test.ts ./scripts/release/native-install-ed25519.test.ts
      - run: bun run preflight --only native
      # The oldest glibc the built bake starts on, from its version needs; the
      # preflight's workspace build left the debug binary, whose needs match
      # the release build's.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: bun scripts/release/glibc-floor.ts rust/target/debug/bake
      # Step durations and the slowest nextest cases, including after a failure.
      - name: Summarize timings
        if: always()
        continue-on-error: true
        run: bun scripts/ci-step-summary.ts --title "rust (${{ matrix.os }})"
      # Keep per-test durations and failures, including when a later gate fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-log-${{ matrix.os }}
          path: |
            .preflight/rust*.log
            rust/target/nextest/ci/junit.xml
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rust-failures-${{ matrix.os }}
          path: .preflight/
          if-no-files-found: ignore
          include-hidden-files: true

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Installing takes 30-80 s here, so Bun's package cache is kept between
      # runs; setup-bun caches only the executable. Bun reports where its cache
      # is, and a changed lockfile starts a new cache instead of growing an old one.
      - id: bun-cache
        shell: bash
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --prefer-offline
      - run: bun test scripts/workspace.test.ts scripts/release apps/tui/packages/app/tests/build.test.ts apps/tui/packages/app/tests/release.test.ts
      - run: bun run build
      - run: bun run test:runtime apps/cli/tests/bin.spec.ts packages/session/session-persistence-jsonl/tests/win32.spec.ts packages/session/session-persistence-jsonl/tests/lease.spec.ts packages/session/session-persistence-jsonl/tests/lease.two-process.spec.ts
      - run: bun run release:pack
      # A throwaway key: CI never holds the release signing key. verify-local
      # checks the manifest against it, then installs and updates through it.
      # It installs with the frozen 0.3 installers under
      # scripts/release/fixtures/legacy-0.3/, because distribution/host's are
      # now the native ones; 0.3 itself is released from release/0.3.
      - run: bun run release:assemble --ephemeral-key
      - run: bun run release:verify-local

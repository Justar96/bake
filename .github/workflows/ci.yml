name: Bake

on:
  # Bake's CI runs locally (AGENTS.md), so this workflow runs only by hand,
  # when the owner asks for a check of a platform not at hand. Linux x86_64
  # is checked before every push, so a manual run checks Windows x64, the
  # other released platform, unless it names another.
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to check
        type: choice
        default: windows
        options:
          - linux
          - windows-and-macos
          - windows
          - macos
          - all

permissions:
  contents: read

concurrency:
  group: bake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A manual run validates only the platforms it names.
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON('{"all":["ubuntu-latest","windows-latest","macos-latest"],"linux":["ubuntu-latest"],"windows-and-macos":["windows-latest","macos-latest"],"windows":["windows-latest"],"macos":["macos-latest"]}')[inputs.platforms || 'windows'] }}
    name: bake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cold Wasmtime builds need extra time on Windows and macOS.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || 60 }}
    steps:
      - uses: actions/checkout@v4
      # Defender scans every file Cargo creates, which makes small-file I/O
      # several times slower than on the other hosts.
      - name: Exclude the workspace and temp directory from Defender
        if: runner.os == 'Windows'
        # An image without Defender has nothing to exclude.
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo"
      # The process-owner tests run a real PID-1 child in an unprivileged
      # namespace; Ubuntu's AppArmor default otherwise denies its uid map.
      - name: Enable Linux process namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Integration tests exercise the real search tools and Linux sandbox.
      - name: Install ripgrep and bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep bubblewrap
          bwrap --version
      # On Linux, a sandbox backend or kernel
      # fault check that cannot run fails the job instead of skipping itself.
      - name: Require the Linux sandbox backends and kernel fault checks
        if: runner.os == 'Linux'
        run: |
          echo 'BAKE_REQUIRE_SANDBOX_BACKENDS=bwrap,landlock' >> "$GITHUB_ENV"
          echo 'BAKE_REQUIRE_KERNEL_FAULTS=1' >> "$GITHUB_ENV"
      - name: Install ripgrep and fd
        if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      # rust-lld marks the GLIBC_2.39 need of the weakly bound pidfd functions
      # weak, where GNU ld leaves it unmarked and the binary would not start
      # below glibc 2.39, so every Linux build links with the pinned
      # toolchain's own rust-lld, as the release build does.
      - name: Link with the toolchain's rust-lld
        if: runner.os == 'Linux'
        run: |
          gcc_ld="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/gcc-ld"
          [ -x "$gcc_ld/ld.lld" ] || { echo "The pinned toolchain ships no $gcc_ld/ld.lld" >&2; exit 1; }
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld -C link-arg=-B$gcc_ld" >> "$GITHUB_ENV"
      # Reuse dependency builds across runs; the Windows job otherwise spends
      # most of its time budget compiling the workspace twice (clippy and test).
      # Save even when a later step fails: a runner whose job fails every run,
      # as Windows did on its known PTY gaps, otherwise never saves and
      # rebuilds every dependency each time (run 39502149981: no cache found).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked

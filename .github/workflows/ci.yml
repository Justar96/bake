name: Bake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A merged pull request was already checked on its merge ref, and the release
# tag pushed alongside it builds and tests every platform again, so its merge
# commit on main is skipped. Direct pushes to main still run.
jobs:
  # Both jobs run `bun run preflight`, the command contributors run before a
  # pull request, split so the whole runtime suite runs beside the rest.
  preflight:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request ')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part:
          - name: checks
            args: --full --skip runtime
          - name: runtime
            args: --full --only build,runtime
    name: ${{ matrix.part.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The bash tool runs in bubblewrap, which Ubuntu runners lack, and
      # AppArmor there denies it the unprivileged user namespaces it needs.
      - name: Enable the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The plugin manager installs external profile plugins with pnpm, separate
      # from Bun's workspace, and one regression test runs a real pnpm install.
      - name: Install pnpm for the plugin manager
        if: matrix.part.name == 'runtime'
        run: npm install --global pnpm@11
      - run: bun run preflight ${{ matrix.part.args }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.part.name }}-failures-${{ matrix.os }}
          path: |
            .preflight/
            apps/tui/.smoke/
          if-no-files-found: ignore

  windows-release:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request ')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test scripts/workspace.test.ts scripts/release apps/tui/packages/app/tests/build.test.ts apps/tui/packages/app/tests/release.test.ts
      - run: bun run build
      - run: bun run release:pack
      # A throwaway key: CI never holds the release signing key. verify-local
      # checks the manifest against it, then installs and updates through it.
      - run: bun run release:assemble --ephemeral-key
      - run: bun run release:verify-local

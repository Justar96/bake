name: Bake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The bash tool runs in bubblewrap, which Ubuntu runners lack, and
      # AppArmor there denies it the unprivileged user namespaces it needs.
      - name: Enable the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run verify
      - run: bun run lint
      - name: Runtime profile regression tests
        run: bun run test:runtime apps/cli/tests/args.spec.ts packages/boot/app-boot/tests/profile.spec.ts packages/boot/app-boot/tests/profile-sanitize.spec.ts packages/boot/plugin-manager/tests/manager.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terminal-failures-${{ matrix.os }}
          path: apps/tui/.smoke/
          if-no-files-found: ignore

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test scripts/workspace.test.ts scripts/release apps/tui/packages/app/tests/build.test.ts apps/tui/packages/app/tests/release.test.ts
      - run: bun run build
      - run: bun run release:pack
      # A throwaway key: CI never holds the release signing key. verify-local
      # checks the manifest against it, then installs and updates through it.
      - run: bun run release:assemble --ephemeral-key
      - run: bun run release:verify-local

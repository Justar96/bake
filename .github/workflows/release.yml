name: Release

# Push a tag `v<version>` from the default branch to release the native agent
# for linux-x64 and linux-arm64: each is built, packed, and installed by the
# shipped installer on its own runner, the two archives are assembled into one
# complete release, then one job signs the native manifest, drafts and
# publishes the GitHub release, deploys the download service, and checks what
# it serves. Run it by hand for a dry run of the builds and the assembly,
# which publishes nothing and reports what would refuse a tag.
#
# Every step is `bake-release` (crates/bake-release), which checks each
# artifact with `bake-update`, the code a user's `bake update` runs. Node runs
# only the download service's own scripts and wrangler (distribution/host).
# The service also keeps serving the frozen 0.3 route, `latest.json`, which
# 0.3 installs update from: the publish job carries the served copy forward
# unchanged.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

# Queue every release; the default single-pending behavior can discard a tag.
concurrency:
  group: bake-release
  queue: max

env:
  BAKE_RELEASE_BASE_URL: https://bake.justar.dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tool
      # A manual run always checks builds only, including when started on a
      # tag, and builds whatever version the workspace holds. A pushed tag must
      # be on the default branch and name a new native release; a rerun may
      # find the version it already deployed.
      - id: check
        run: |
          cargo build --locked -p bake-release
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo "The release tag must point to a commit on $DEFAULT_BRANCH" >&2; exit 1; }
            args=(--tag "$GITHUB_REF_NAME" --notes release-notes.md)
            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then args+=(--retry); fi
            target/debug/bake-release preflight "${args[@]}"
          else
            target/debug/bake-release preflight --dry-run --notes release-notes.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    needs: preflight
    strategy:
      # Both platforms report, but publishing needs both.
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A clean release build, without the CI job's dependency cache, plus
    # cargo-about built from source.
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCHIVE: .artifacts/bake-native-release/${{ needs.preflight.outputs.version }}/bake-v${{ needs.preflight.outputs.version }}-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v4
      # The installed bake's self-check runs on a host like the user's, with
      # the bash tool's bubblewrap sandbox available; AppArmor on Ubuntu
      # runners otherwise denies it the unprivileged user namespaces it needs.
      - name: Enable the Linux sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      # Stable rustc links through its own rust-lld by default only on x86_64.
      # On the arm64 runner the link otherwise leaves the GLIBC_2.39 need of
      # the weakly bound pidfd functions unmarked, as GNU ld does, so the
      # binary would not start below glibc 2.39 (release dry run
      # 39801454576). rust-lld marks that need weak, so every Linux build
      # links with the pinned toolchain's own rust-lld.
      - name: Link with the toolchain's rust-lld
        run: |
          gcc_ld="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/gcc-ld"
          [ -x "$gcc_ld/ld.lld" ] || { echo "The pinned toolchain ships no $gcc_ld/ld.lld" >&2; exit 1; }
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld -C link-arg=-B$gcc_ld" >> "$GITHUB_ENV"
      # The archive's dependency license text is generated with exactly
      # cargo-about 0.9.2, built here rather than restored from a cache.
      - name: Install cargo-about 0.9.2
        run: |
          cargo install cargo-about --version =0.9.2 --locked --features cli --root "$RUNNER_TEMP/cargo-about-0.9.2"
          echo "BAKE_CARGO_ABOUT=$RUNNER_TEMP/cargo-about-0.9.2/bin/cargo-about" >> "$GITHUB_ENV"
      - name: Build the release bake and the release tool
        run: cargo build --release --locked -p bake-cli -p bake-release
      # Checks the binary's version, platform, and documentation, archives it
      # with its license bundle, unpacks it with bake-update's reader, and
      # checks it again; refuses a runner that is not ${{ matrix.target }}.
      - name: Pack the archive
        run: target/release/bake-release pack
      - name: Check the archive's name
        run: test -f "$ARCHIVE"
      - name: Check the glibc floor
        run: target/release/bake-release glibc-floor target/release/bake
      # The archive this run publishes, installed by the shipped install.sh
      # from a loopback host signed with a throwaway key; the release key
      # never reaches a build.
      - name: Install the archive with the shipped installer
        run: target/release/bake-release rehearse --archive "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Both archives, assembled into the complete release the publish job signs,
  # with a throwaway key; on a manual run this is the last step.
  assemble:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tool
      - run: cargo build --locked -p bake-release
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: .artifacts/bake-native-release/${{ env.VERSION }}
          merge-multiple: true
      - run: target/debug/bake-release assemble "$VERSION" --complete --ephemeral-key --offline

  publish:
    needs: [preflight, assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The environment holds the signing key and the deploy token, and can
    # require an approval before either is used.
    environment:
      name: release
      url: ${{ env.BAKE_RELEASE_BASE_URL }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tool
      - run: cargo build --locked -p bake-release
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: .artifacts/bake-native-release/${{ env.VERSION }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      # A rerun may follow a published GitHub release whose deploy failed: the
      # service must then serve exactly what that release holds, never a
      # manifest signed again. Otherwise the assembler signs the archives and
      # refuses a version the live channel does not precede.
      - name: Stage the signed release
        env:
          BAKE_NATIVE_RELEASE_SIGNING_KEY: ${{ secrets.BAKE_NATIVE_RELEASE_SIGNING_KEY }}
        run: |
          public=distribution/host/public/native
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "GitHub release $GITHUB_REF_NAME is already published; staging its signed assets instead of signing new ones"
            published="$RUNNER_TEMP/bake-published"
            gh release download "$GITHUB_REF_NAME" --dir "$published" --pattern 'stable.json*' --pattern "bake-v$VERSION-*.tar.gz"
            mkdir -p "$public/releases/$VERSION"
            cp "$published/stable.json" "$published/stable.json.sig" "$public/"
            cp "$published"/bake-v"$VERSION"-*.tar.gz "$public/releases/$VERSION/"
          else
            [ -n "$BAKE_NATIVE_RELEASE_SIGNING_KEY" ] || { echo 'The release environment has no BAKE_NATIVE_RELEASE_SIGNING_KEY secret' >&2; exit 1; }
            key="$RUNNER_TEMP/native-release-signing-key.pem"
            trap 'rm -f "$key"' EXIT
            ( umask 077; printf '%s\n' "$BAKE_NATIVE_RELEASE_SIGNING_KEY" > "$key" )
            target/debug/bake-release assemble "$VERSION" --complete --key-file "$key"
          fi
      # The deploy's own gate, run first: the committed native key only.
      - run: node distribution/host/verify-native-manifest.mjs --complete --required
      # The deploy refuses to stage a site without a signed latest.json, and
      # 0.3 installs keep updating from it, so the served copy goes forward
      # unchanged, checked against the committed 0.3 key.
      - name: Carry the frozen 0.3 route forward
        run: |
          for file in latest.json latest.json.sig; do
            curl -fsSL --retry 3 "$BAKE_RELEASE_BASE_URL/$file" -o "distribution/host/public/$file"
          done
          node distribution/host/verify-manifest.mjs --allow-missing-archives
      - name: Draft the GitHub release
        run: |
          files=(distribution/host/public/native/releases/"$VERSION"/*.tar.gz distribution/host/public/native/stable.json distribution/host/public/native/stable.json.sig distribution/host/install.sh distribution/host/install.ps1)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            else
              echo "GitHub release $GITHUB_REF_NAME is already published; checking its assets instead of replacing them"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
              --title "Bake $VERSION" --notes-file release-notes.md
          fi
      - name: Check the release's uploaded assets
        run: |
          downloaded="$RUNNER_TEMP/bake-release-assets"
          mkdir -p "$downloaded"
          gh release download "$GITHUB_REF_NAME" --dir "$downloaded"
          files=(distribution/host/public/native/releases/"$VERSION"/*.tar.gz distribution/host/public/native/stable.json distribution/host/public/native/stable.json.sig distribution/host/install.sh distribution/host/install.ps1)
          for file in "${files[@]}"; do cmp "$file" "$downloaded/$(basename "$file")"; done
          [ "$(find "$downloaded" -maxdepth 1 -type f | wc -l)" -eq "${#files[@]}" ] || { echo 'The release has unexpected assets' >&2; exit 1; }
      # The download service redirects every archive to this release, so it
      # is published first.
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      # The Worker stages its site from distribution/host and public/, leaving
      # the archives out: it redirects each one to the release.
      - name: Deploy the download service
        working-directory: distribution/host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo 'The release environment has no CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          [ "$REPOSITORY_VISIBILITY" = public ] || { echo 'The download service redirects to GitHub release assets, which need a public repository' >&2; exit 1; }
          npm run deploy -- --message "Bake $VERSION ($GITHUB_SHA)"
      # A successful deploy is not a release until the public host serves it,
      # with the 0.3 route intact.
      - run: target/debug/bake-release verify-live "$VERSION" --complete

name: Release

# Push a tag `v<version>` from the default branch to release: every platform is built and checked on
# its own runner, then one job signs the manifest, drafts the GitHub release,
# deploys the download service, checks what it serves, and publishes the
# draft. Run it by hand for a dry run of the builds, which publishes nothing.
#
# The GitHub release carries everything a client needs, signed the same way,
# so it is a release host of its own. Set the repository variable
# BAKE_DOWNLOAD_SERVICE to `off` to publish there alone, without Railway.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

# Queue every release; the default single-pending behavior can discard a tag.
concurrency:
  group: bake-release
  queue: max

env:
  BAKE_RELEASE_BASE_URL: https://bake.justar.dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOWNLOAD_SERVICE: ${{ vars.BAKE_DOWNLOAD_SERVICE }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # A manual run always checks builds only, including when started on a tag.
      # A pushed tag must be on the default branch and name a new release.
      - id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || { echo "The release tag must point to a commit on $DEFAULT_BRANCH" >&2; exit 1; }
            args=(--tag "$GITHUB_REF_NAME" --notes release-notes.md)
            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then args+=(--retry); fi
            if [ "$DOWNLOAD_SERVICE" = off ]; then
              [ "$REPOSITORY_VISIBILITY" = public ] || { echo 'GitHub-only releases require a public repository' >&2; exit 1; }
              args+=(--offline --github-repository "$GITHUB_REPOSITORY")
            fi
            bun scripts/release/preflight.ts "${args[@]}"
          else
            bun scripts/release/preflight.ts --offline --notes release-notes.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    needs: preflight
    strategy:
      # Every platform reports, but publishing needs all of them.
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: win32-x64, os: windows-latest }
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Native modules are built for the runner, so the runner must be the target.
      - name: Check the runner builds ${{ matrix.target }}
        shell: bash
        run: |
          host="$(node -p 'process.platform + "-" + process.arch')"
          [ "$host" = "${{ matrix.target }}" ] || { echo "Runner is $host, not ${{ matrix.target }}" >&2; exit 1; }
      - run: bun run release:pack
      # Install this archive with the real installer and update through it,
      # signed with a throwaway key; the release key never reaches a build.
      - run: bun run release:assemble --ephemeral-key
      - run: bun run release:verify-local
      # The bash tool runs in bubblewrap, which Ubuntu runners lack, and
      # AppArmor there denies it the unprivileged user namespaces it needs.
      - name: Enable the Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The PTY driver needs a POSIX terminal.
      - name: Built-profile terminal scenarios
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: bun run test:e2e --no-build
      # The driver keeps a failed scenario's session logs and workspace in the
      # OS temporary directory, which is not /tmp on macOS.
      - name: Collect kept terminal sessions
        if: failure() && runner.os != 'Windows'
        run: |
          mkdir -p apps/tui/.smoke/sessions
          cp -RP "$(node -p 'require("node:os").tmpdir()')"/dsh-tui-pty-* apps/tui/.smoke/sessions/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os != 'Windows'
        with:
          name: terminal-failures-${{ matrix.target }}
          path: apps/tui/.smoke/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: .artifacts/bake-release/${{ env.VERSION }}/bake-v${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [preflight, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment holds the signing key and the deploy token, and can
    # require an approval before either is used.
    environment:
      name: release
      url: ${{ env.BAKE_RELEASE_BASE_URL }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: .artifacts/bake-release/${{ env.VERSION }}
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Sign the manifest
        env:
          BAKE_RELEASE_SIGNING_KEY: ${{ secrets.BAKE_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$BAKE_RELEASE_SIGNING_KEY" ] || { echo 'The release environment has no BAKE_RELEASE_SIGNING_KEY secret' >&2; exit 1; }
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          ( umask 077; printf '%s\n' "$BAKE_RELEASE_SIGNING_KEY" > "$key" )
          BAKE_RELEASE_SIGNING_KEY_FILE="$key" bun run release:assemble --complete
      # The image build's own gate, run first: the committed key only.
      - run: node distribution/host/verify-manifest.mjs --complete
      # A retry may follow a successful deploy. Never replace the archives of
      # an already served version with different bytes.
      - name: Check the current release before publishing
        if: vars.BAKE_DOWNLOAD_SERVICE != 'off'
        run: bun run release:preflight --tag "$GITHUB_REF_NAME" --retry --expected-manifest distribution/host/public/latest.json
      # A rerun may follow a published GitHub release whose deploy failed: it
      # keeps those assets, and the next step proves they are this build's.
      - name: Draft the GitHub release
        run: |
          files=(distribution/host/public/releases/"$VERSION"/*.tar.gz distribution/host/public/latest.json distribution/host/public/latest.json.sig distribution/host/install.sh distribution/host/install.ps1)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            else
              echo "GitHub release $GITHUB_REF_NAME is already published; checking its assets instead of replacing them"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
              --title "Bake $VERSION" --notes-file release-notes.md
          fi
      - name: Check the release's uploaded assets
        run: |
          downloaded="$RUNNER_TEMP/bake-release-assets"
          mkdir -p "$downloaded"
          gh release download "$GITHUB_REF_NAME" --dir "$downloaded"
          files=(distribution/host/public/releases/"$VERSION"/*.tar.gz distribution/host/public/latest.json distribution/host/public/latest.json.sig distribution/host/install.sh distribution/host/install.ps1)
          for file in "${files[@]}"; do cmp "$file" "$downloaded/$(basename "$file")"; done
          [ "$(find "$downloaded" -maxdepth 1 -type f | wc -l)" -eq "${#files[@]}" ] || { echo 'The release has unexpected assets' >&2; exit 1; }
      # The download service redirects every archive to this release, so it
      # is published and checked first.
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      # Its assets download without a login only from a public repository.
      - name: Check the GitHub release as a client reads it
        if: github.event.repository.visibility == 'public'
        env:
          BAKE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: bun run release:verify-live "$VERSION" --complete
      # Five archives exceed Railway's upload limit, so the service carries the
      # signed manifest and installers alone.
      - name: Deploy the download service
        if: vars.BAKE_DOWNLOAD_SERVICE != 'off'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo 'The release environment has no RAILWAY_TOKEN secret' >&2; exit 1; }
          [ "$REPOSITORY_VISIBILITY" = public ] || { echo 'The download service redirects to GitHub release assets, which need a public repository' >&2; exit 1; }
          host="$RUNNER_TEMP/bake-downloads"
          cp -R distribution/host "$host"
          rm -rf "$host/public/releases"
          npm install --global @railway/cli@5.62.1
          railway up "$host" --path-as-root --no-gitignore --ci \
            --project 28ff3000-7240-4c57-81d1-7bd05445c1ee \
            --environment production --service bake-downloads \
            -m "Bake $VERSION ($GITHUB_SHA)"
      # A successful deploy is not a release until the public host serves it.
      - if: vars.BAKE_DOWNLOAD_SERVICE != 'off'
        run: bun run release:verify-live "$VERSION" --complete

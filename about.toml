# cargo-about license policy. Preserve crate NOTICE files and the reviewed
# texts under licenses/ when assembling a redistribution.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# Target platforms covered by the license policy.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Cover build dependencies as well as runtime dependencies.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Bake crates carry the repository MIT license and their own NOTICE files.
private = { ignore = true }

# Clarifications pin upstream license files by checksum. Re-review them
# when updating the corresponding dependency.

# granit-parser 1.3.0 (through serde-saphyr): LICENSE states that
# redistribution must include the inherited notices it points to under
# `.licenses/`; cargo-about reads none of them. Under the MIT choice, keep
# LICENSE and both inherited MIT texts.
[granit-parser.clarify]
license = "MIT OR Apache-2.0"

[[granit-parser.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "1af262e6647807eecaec988ecf2b783fb8fdbdecba396d582c1aab90615f6845"

[[granit-parser.clarify.files]]
path = ".licenses/ChenYuheng-MIT"
license = "MIT"
checksum = "70480dc70c2fe1d9bbb64dab9a0abce266332905ffef9cabeae26dd027716ecb"

[[granit-parser.clarify.files]]
path = ".licenses/Ethiraric-MIT"
license = "MIT"
checksum = "90f4ea53f408858ba4886f57b8e3ceac876eefbb59c20f0844f0abbfa59e2749"

# ryu 1.0.23: `Apache-2.0 OR BSL-1.0`; cargo-about does not identify its
# LICENSE-APACHE (indented differently from the SPDX text).
[ryu.clarify]
license = "Apache-2.0 OR BSL-1.0"

[[ryu.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"

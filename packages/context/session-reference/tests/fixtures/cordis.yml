- name: 'bake-session'
- name: 'bake-system-prompt'
- name: 'bake-tools'
- name: 'bake-fs-local'
- name: 'bake-tool-fs'
- name: 'bake-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- name: 'bake-session-reference'
  config:
    maxReferenceBytes: 360
- name: './source-session.ts'
- name: 'bake-spill-local'
  config:
    root: '{{spillRoot}}'
    cleanupPeriodDays: 0

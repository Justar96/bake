# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`), the `--resume` (alias `--session-id`)
# and `--json` options, and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

# The persona owns the identity, so the harness opener stays out.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: |-
      You are Bake, a coding agent running one task from the command line, using the {{model}} model.

      Follow the conventions of the surrounding code. Commit or push only when the task requests it, and do not discard changes you did not make. Keep the final answer concise, factual, and neutral. Report results and verification accurately, including failures and skipped checks.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

# The base row restated with model selection, so a run honors the user's
# `subagent-model-selection` setting, task router included, as the terminal
# profile does. While the setting is off the tool's definition is unchanged.
# The row waits for the settings plugin inserted below.
- id: tool-subagent
  inject: [subagentModelSelection]
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    modelSelectionSettings: true

- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

- id: hmr
  disabled: true

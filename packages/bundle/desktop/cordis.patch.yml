# The dsh-desktop bundle patch: a long-lived protocol bridge over dsh-base for
# the Bake Desktop app. It mounts no Host, HTTP server, or browser plugin. The
# desktop launches the process with the workspace as its working directory,
# speaks the protocol over the Electron utility-process message port (or
# stdio under plain Node), and answers every approval the bridge forwards.

# The persona owns the identity, so the harness opener stays out.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: |-
      You are Bake, a coding agent in the Bake Desktop app, using the {{model}} model.

      Follow the conventions of the surrounding code. Commit or push only when requested, and do not discard changes you did not make unless asked. Keep replies concise, factual, and neutral. Report results and verification accurately, including failures and skipped checks.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: desktop-bridge
      name: '@deepseek-ai/dsh-desktop'

- id: hmr
  disabled: true

# The bake-base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: tool-plugin-manager
      name: 'bake-plugin-manager/tools'
      disabled: true

    - id: plugin-manager
      name: 'bake-plugin-manager'
      disabled: !!js "!ctx.get('profileContext')"

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    # Profile configuration reloads by default; module roots are opt-in.
    - id: hmr
      name: 'bake-hmr'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        root: []

    - id: llm
      name: 'bake-llm'

    - id: session
      name: 'bake-session'

    - id: typert
      name: 'bake-typert-registry'

    - id: typert-loader
      name: 'bake-typert-loader'

    - id: typert-gateway
      name: 'bake-api-gateway'

    - id: session-title
      name: 'bake-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: 'bake-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: 'bake-user-questions'

    - id: agent
      name: 'bake-agent'

    # The transport-independent default for Agents created by entry points.
    # No provider is the default: a new install starts without a model until
    # the user signs in and chooses one, and that saved selection becomes the
    # default consumers read at creation time.
    - id: agent-default-model
      name: 'bake-agent-default-model'

    - id: jobs
      name: 'bake-jobs-local'

    - id: llm-retry
      name: 'bake-llm-retry'

    # User-settings document (`$BAKE_HOME/settings.yaml`, hot-reloaded): a
    # `llm-pi-ai:` section there overrides the adapter entry below without a
    # restart. Bake has no web client; this file is edited
    # directly or through the TUI's settings surface.
    - id: settings
      name: 'bake-settings-file'

    # Credential sources: inherited environment over the managed
    # `$BAKE_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; only the managed document is
    # written back, and it is never materialized into the process environment.
    - id: credentials
      name: 'bake-credentials-local'

    # The LLM adapter. It ships one route, DeepSeek over its Anthropic-format
    # Messages endpoint; further routes register live when a `llm-pi-ai:` settings
    # section supplies their profiles, and that section deep-merges over this
    # entry per route and field. No key is inlined: each route resolves its
    # apiKeyEnv reference per request through the credential store above.
    # DeepSeek reads `thinking.type` as enabled or disabled beside an
    # `output_config.effort`, hence the adaptive-thinking respelling; it reads
    # the latest system message as the whole prompt and accepts native tool
    # changes, which the two in-history declarations state per model.
    - id: llm-pi-ai
      name: 'bake-llm-pi-ai'
      config:
        providers:
          deepseek-official:
            displayName: DeepSeek
            apiKeyEnv: DEEPSEEK_API_KEY
            api: anthropic-messages
            baseURL: https://api.deepseek.com/anthropic
            reasoning: high
            adaptiveThinkingType: enabled
            # DeepSeek caches prefixes on its own: send the body its earlier
            # native adapter did, without Anthropic's cache scaffolding.
            messagesWire:
              dropDeferredToolPlaceholder: true
              stripCacheControl: true
              mergeAdjacentRoles: true
            compat:
              forceAdaptiveThinking: true
              allowEmptySignature: true
            models:
              - id: deepseek-flash
                name: DeepSeek-V41-Flash
                contextWindow: 1000000
                maxTokens: 256000
                input: [text, image]
                reasoningEfforts:
                  off:
                  low: low
                  high: high
                  max: max
                systemPromptUpdate: in-history
                toolUpdate: in-history
              - id: deepseek-v4-pro
                name: DeepSeek-V4-Pro
                description: Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or quality-critical tasks at higher cost.
                contextWindow: 1000000
                maxTokens: 256000
                input: [text]
                reasoningEfforts:
                  off:
                  low: low
                  high: high
                  max: max

    - id: session-persistence-jsonl
      name: 'bake-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: 'bake-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: 'bake-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: 'bake-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: 'bake-storage'

    - id: storage-json
      name: 'bake-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: 'bake-storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: 'bake-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Session upload has no default destination. Without an endpoint, `mode`
    # falls back to DISABLED: the backend builds no exporter, reports
    # `sharing: 'disabled'`, and `/feedback` says the feedback stays in the
    # local session log. BAKE_TELEMETRY_OTLP_URL (a full OTLP/HTTP logs URL)
    # enables upload to that URL only, in BAKE_TELEMETRY_MODE (default
    # FEEDBACK_ONLY); each BAKE_ name falls back to its earlier DSH_ spelling
    # when it is unset or blank.
    # OTel then releases a Session-log prefix only after explicit user
    # feedback, regardless of model provider; ordinary activity never
    # triggers capture. A non-empty BAKE_ or DSH_TELEMETRY_DISABLED — any value,
    # including '0'/'false' — opts the process out even with a URL set (the
    # launchers patch the row disabled; config cannot disable a row). Exports
    # carry the harness home's anonymous user id ($BAKE_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: 'bake-session-telemetry-otel'
      config:
        mode: !!js "(process.env.BAKE_TELEMETRY_OTLP_URL?.trim() ? process.env.BAKE_TELEMETRY_OTLP_URL : process.env.DSH_TELEMETRY_OTLP_URL) ? (process.env.BAKE_TELEMETRY_MODE?.trim() ? process.env.BAKE_TELEMETRY_MODE : process.env.DSH_TELEMETRY_MODE) || 'FEEDBACK_ONLY' : 'DISABLED'"
        shutdownTimeoutMillis: 3000
        exporter:
          # TODO(bake): Bake's own OTLP logs endpoint goes here, in place of the
          # empty default. `mode` keys on BAKE_TELEMETRY_OTLP_URL alone, so give
          # it the same fallback when this default gets a URL.
          url: !!js "(process.env.BAKE_TELEMETRY_OTLP_URL?.trim() ? process.env.BAKE_TELEMETRY_OTLP_URL : process.env.DSH_TELEMETRY_OTLP_URL) || ''"
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    # Process health for long sessions: sustained event-loop delay and heap use
    # near V8's limit append rate-limited records to
    # `$BAKE_HOME/diagnostics/watchdog.<date>.<time>.<pid>.jsonl`. Nothing reaches
    # stdout, stderr, or the model. Node's fatal-error report is directed there
    # only when Node runs with --report-exclude-env, since otherwise it can carry
    # environment variables. Near-limit heap snapshots stay off: they are
    # heap-sized, pause the process, and need Node's --diagnostic-dir to match.
    - id: runtime-watchdog
      name: 'bake-runtime-watchdog'
      config:
        directory: !!js dshHomePath('diagnostics')

    - id: subprocess
      name: 'bake-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: 'bake-sandbox-local'

    - id: sandbox-policy
      name: 'bake-sandbox-policy'
      config:
        mode: !!js "(process.env.BAKE_PERMISSION_MODE?.trim() ? process.env.BAKE_PERMISSION_MODE : process.env.DSH_PERMISSION_MODE) ?? 'workspace-write'"
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: 'bake-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: 'bake-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: 'bake-user-approval'
      config:
        policy: !!js "((process.env.BAKE_PERMISSION_MODE?.trim() ? process.env.BAKE_PERMISSION_MODE : process.env.DSH_PERMISSION_MODE) ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: 'bake-permission-presets'
      config:
        defaultPreset: !!js "(process.env.BAKE_PERMISSION_MODE?.trim() ? process.env.BAKE_PERMISSION_MODE : process.env.DSH_PERMISSION_MODE) ?? 'workspace-write'"
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: 'bake-shell-env'

    - id: tool-bash
      name: 'bake-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: 'bake-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: 'bake-tool-jobs'

    - id: fs-observation-policy
      name: 'bake-fs-observation-policy'

    - id: tool-fs
      name: 'bake-tool-fs'

    - id: tool-fs-search
      name: 'bake-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: 'bake-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: 'bake-skill'

    - id: skill-filesystem
      name: 'bake-skill-filesystem'

    - id: skill-badge
      name: 'bake-skill-badge'
      disabled: true

    - id: tool-skill
      name: 'bake-tool-skill'

    - id: commands
      name: 'bake-commands'

    - id: command-feedback
      name: 'bake-command-feedback'

    - id: goal
      name: 'bake-goal'

    - id: goal-round-driver
      name: 'bake-goal-round-driver'

    - id: command-goal
      name: 'bake-command-goal'

    - id: token-meter
      name: 'bake-token-meter'

    - id: compaction-basic
      name: 'bake-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: 'bake-command-compact'

    - id: subagent
      name: 'bake-subagent'

    - id: subagent-spawn-in-process
      name: 'bake-subagent-spawn-in-process'
      config:
        providerName: spawn

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: 'bake-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: 'bake-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: 'bake-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # `run_code` programs run in a fresh QuickJS VM whose only capability is
    # the tool bindings; nested calls keep each tool's own policy and approval.
    - id: ptc-runtime
      name: 'bake-ptc-runtime-codemode'

    - id: timeout-policy
      name: 'bake-tool-call-timeout-policy'

    - id: spill-local
      name: 'bake-spill-local'

    - id: spill-policy
      name: 'bake-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: 'bake-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: 'bake-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # When an image-capable route rejects a request as over its image budget,
    # replace the oldest images with placeholders on the surface and retry.
    - id: image-offload
      name: 'bake-compaction-image-offload'

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: 'bake-tool-goal'

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: 'bake-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web. DeepSeek
    # search resolves the same DEEPSEEK_API_KEY
    # credential the settings file manages for chat, at each search; its Messages
    # endpoint is separate from the chat-completions endpoint, so it takes its own
    # base-URL override. Anonymous fetch accepts only public HTTP(S) destinations,
    # resolves and validates every destination, and pins every actual connection.
    # Search is a full auxiliary model request with server-side retrieval, so this
    # shipped DeepSeek route gets 60s while the provider-neutral tool default
    # remains 30s.
    - id: web
      name: 'bake-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http

    - id: web-search-deepseek
      name: 'bake-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-fetch-http
      name: 'bake-web-fetch-http'

    - id: tool-web
      name: 'bake-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: mcp-resources
      name: 'bake-mcp-resources'

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: 'bake-tools'

    # The deployment persona is a deployment choice; tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: 'bake-system-prompt'
      config:
        personaPrefix: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: 'bake-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: 'bake-fs-sandbox'

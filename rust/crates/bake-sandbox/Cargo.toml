[package]
name = "bake-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bake's process-confinement contract: sandbox modes, per-call policies, escalation vocabulary, and the provider seam its backends implement"

[dependencies]
# The local backends' functional probes: bounded, cancellable subprocesses and
# the once-only cached verdict.
tokio = { workspace = true, features = ["process", "time", "sync", "io-util"] }
# The Windows runner's capability SIDs (SHA-256) and private temp names.
ring.workspace = true

[target.'cfg(unix)'.dependencies]
# The Landlock helper's raw syscalls, `prctl`, `open(O_PATH)`, and `fstat`.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows runner's restricted token, DACL grants, Job, and process
# creation.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
# The enforcement tests' raw deletion, open, token, and SDDL probes and
# their process and Job guards; `Win32_Security_Isolation` is the mechanism
# probe's AppContainer profile and `Win32_System_Console` its candidates'
# output redirection.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "time", "sync", "io-util", "rt", "rt-multi-thread", "macros"] }

[features]
# A provider that runs commands unconfined while reporting a chosen mode, for
# tests of code above the seam. Never enable it in a shipped binary.
testing = []

# Real enforcement through each OS backend. Its own `main` serves as the
# Landlock helper when re-executed, so the tests confine through a real
# self-re-exec exactly as `bake-rs` does.
[[test]]
name = "enforcement"
path = "tests/enforcement.rs"
harness = false

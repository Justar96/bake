[package]
name = "bake-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bake-rs"
path = "src/main.rs"

[dependencies]
bake-ai.workspace = true
bake-coding-agent.workspace = true
bake-sandbox.workspace = true
bake-tui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros"] }
# `--self-check`: its JSON record, and the SHA-256 of each embedded
# documentation topic. Both are already in the binary through `bake-ai`.
ring.workspace = true

[dev-dependencies]
# The Wasm plugin host tests: async drivers, and components built from
# core-module text with the WIT tooling Wasmtime's bindings already use.
# `test-util` lets the compile-deadline test hold the host's clock until the
# helper reports that it is compiling.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "process", "io-util", "sync", "test-util"] }
wat = { version = "=1.258.3", default-features = false }
wasm-encoder = { version = "=0.258.3", default-features = false }
wit-component = { version = "=0.258.3", default-features = false }
wit-parser = { version = "=0.258.3", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The shipped binary consumes mcp.json; its test re-executes as a stdio server.
[[test]]
name = "mcp"
harness = false

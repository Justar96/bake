[package]
name = "bake-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bake-rs"
path = "src/main.rs"

[dependencies]
bake-ai.workspace = true
bake-coding-agent.workspace = true
bake-sandbox.workspace = true
bake-tui.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "macros"] }
# `--self-check`: its JSON record, and the SHA-256 of each embedded
# documentation topic. Both are already in the binary through `bake-ai`.
serde_json.workspace = true
ring.workspace = true

# `tests/mcp.rs`'s process identities (`bake-coding-agent`'s
# `tests/mcp_session/probe.rs`) and its stop request.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

# The shipped binary as the consumer of `mcp.json`: the test binary
# re-executes itself as the stdio MCP server, so its standard output must
# carry only protocol messages, which libtest's harness would break.
[[test]]
name = "mcp"
harness = false

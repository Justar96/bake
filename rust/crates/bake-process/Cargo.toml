[package]
name = "bake-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The owner of a spawned child and its whole process tree, shared by Bake's coding tools and MCP stdio servers: admission before creation, pinned leader identity, a Unix process group or a Windows Job the child is born in, and kill or detach settled to observed quiescence"

[dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros", "process", "io-util"] }

# `setsid`, `kill(-pgid)`, `waitid(WNOWAIT)`, and macOS `proc_listpids`;
# Tokio's `signal` wakes an exit wait on `SIGCHLD`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
tokio = { workspace = true, features = ["signal"] }

# `CreateProcessW` with a Job and handle list, the kill-on-close Job and its
# completion port with its live pump, and overlapped named pipes with random
# names.
[target.'cfg(windows)'.dependencies]
getrandom.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
# `examples/conpty`'s line protocol: JSON lines with base64 bytes.
base64.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# `tests/windows_job_rundown.rs`: its own job, membership checks, and
# process handles. `examples/conpty`: the pseudoconsole, its control pipes,
# console modes and control events, the job's member list, and thread
# suspension.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

# The Windows job settlement observation and production-path case: the
# binary re-executes itself as its helper processes, whose standard output
# is the protocol. Prints a skip elsewhere.
[[test]]
name = "windows_job_rundown"
harness = false

# The Windows pseudoconsole host the Rust PTY scenarios drive `bake`
# through (`scripts/rust-preview-pty.ts`). A test helper, never packed; its
# protocol tests run under `cargo test` on every platform.
[[example]]
name = "conpty"
path = "examples/conpty/main.rs"
test = true

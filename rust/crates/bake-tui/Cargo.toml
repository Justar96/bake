[package]
name = "bake-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bake-agent.workspace = true
bake-ai.workspace = true
bake-coding-agent.workspace = true
bake-tui-view.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook = { workspace = true, features = ["iterator"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
bake-sandbox.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

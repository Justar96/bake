# cargo-about 0.9.2 configuration for the native license bundle that
# `bun run gen-native-licenses` writes (scripts/release/native-licenses.ts).
# Run it through that script, which pins the tool, selects bake-cli, and
# checks the result against Cargo's own per-target dependency trees.

# Licenses a dependency may be distributed under, in the order a choice is
# made: for `MIT OR Apache-2.0` the MIT text is reproduced. A crate whose
# expression no entry here satisfies fails generation, so a new license is a
# reviewed edit to this list, never a default.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

# The Rust triples behind the five release platform ids, as the release
# runners build them natively (darwin-arm64, darwin-x64, linux-arm64,
# linux-x64, win32-x64). cargo-about evaluates `cfg()` over all of them at
# once; the script takes each target's linked set from `cargo tree`, adds its
# build-host crates for every host, fails on a crate cargo-about missed, and
# leaves out (and lists) a locked crate it reports that no platform builds.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Dev-dependencies never reach the shipped binary. Build dependencies and
# proc macros run while it is built and are kept: the bundle covers every
# crate compiled to produce `bake-rs`, marked by role.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Bake's own crates carry the repository's MIT license and their Pi NOTICE
# files, which the script collects separately.
private = { ignore = true }

# Clarifications locate license files cargo-about does not identify; they
# never change a crate's declared license (the script checks the string). Each
# is keyed by crate name and pinned by file checksums: cargo-about ignores one
# whose checksums do not match, and the script fails when any compiled version
# of the named crate does not match or no platform compiles it, so a
# dependency update must re-review the entry. The comments name the version
# each was written against.

# granit-parser 1.3.0 (through serde-saphyr): LICENSE states that
# redistribution must include the inherited notices it points to under
# `.licenses/`; cargo-about reads none of them. Under the MIT choice, keep
# LICENSE and both inherited MIT texts.
[granit-parser.clarify]
license = "MIT OR Apache-2.0"

[[granit-parser.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "1af262e6647807eecaec988ecf2b783fb8fdbdecba396d582c1aab90615f6845"

[[granit-parser.clarify.files]]
path = ".licenses/ChenYuheng-MIT"
license = "MIT"
checksum = "70480dc70c2fe1d9bbb64dab9a0abce266332905ffef9cabeae26dd027716ecb"

[[granit-parser.clarify.files]]
path = ".licenses/Ethiraric-MIT"

[package]
name = "bake-windows-config-trust-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Standalone, unreviewed research probe: Windows owner/DACL trust for Bake configuration reads. Not product code."

[workspace]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

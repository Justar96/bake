# Symposium (https://symposium.dev) workspace plugin. `cargo agents sync`,
# run from this directory, installs the repository's maintainer skills into
# each configured agent's skill directory: `.claude/skills/` for Claude Code,
# for example, while agents that read `.agents/skills/` find them in place.
# The skills live at the repository root, outside this Cargo workspace, so
# the default `skills/` and `.agents/skills/` groups beside this file are
# replaced with that one source. Symposium 0.5 reads this file only under
# this upper-case name.
name = "bake"

[defaults]
skills = false

[[skills]]
predicates = ["workspace-member()"]
source.path = "../.agents/skills"

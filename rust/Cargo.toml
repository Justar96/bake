[workspace]
resolver = "3"
members = [
    "crates/bake-agent",
    "crates/bake-ai",
    "crates/bake-cli",
    "crates/bake-coding-agent",
    "crates/bake-conformance",
    "crates/bake-tui",
    "crates/bake-tui-view",
]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
bake-agent = { path = "crates/bake-agent" }
bake-ai = { path = "crates/bake-ai" }
bake-coding-agent = { path = "crates/bake-coding-agent" }
bake-tui = { path = "crates/bake-tui" }
bake-tui-view = { path = "crates/bake-tui-view" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
# The core crate the pinned Ratatui release depends on; the view crate uses it
# without the terminal backend.
ratatui-core = { version = "=0.1.2", default-features = false, features = ["std"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
signal-hook = { version = "=0.3.18", default-features = false }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
# The `bake-ai` provider runtime: Tokio for tasks and timers, reqwest over
# rustls (ring, webpki roots) for HTTP/1.1 with chunked streaming bodies, and
# regex for Pi's provider error classifiers. No native TLS or OpenSSL.
tokio = { version = "=1.53.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# The `bake-coding-agent` session store: OS randomness for Pi's session and
# entry ids, and an insertion-ordered map for its JavaScript `Map` indexes.
# Both versions are the ones the lock already carries for ring and serde_json.
getrandom = { version = "=0.2.17", default-features = false }
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
# The `bake-coding-agent` CLIProxyAPI import: a panic-free YAML reader with
# built-in budgets (depth, aliases, nodes, input size) for the 0.3 home's
# `settings.yaml` and `.credentials.yaml` (D25). MIT OR Apache-2.0.
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }

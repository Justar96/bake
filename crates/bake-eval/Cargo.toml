[package]
name = "bake-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bake's paired evaluation runner: runs two built `bake` executables on the same tasks and models and reports the difference. A build tool; it is never shipped."

[[bin]]
name = "bake-eval"
path = "src/main.rs"

[dependencies]
# Owns every `bake` run and task script as a process tree it can stop.
bake-process.workspace = true
# The sample records, the run record, and the `stream-json` lines `bake` prints.
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "io-util", "sync"] }

[dev-dependencies]
# Property tests of the statistics and of the parser of `bake`'s output.
proptest.workspace = true

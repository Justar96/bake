[package]
name = "bake-codemode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The native engine of Pi's codemode for Bake: the pinned QuickJS-NG WebAssembly binary run by Wasmtime in process, with Bake's own WASI shim and C API driver, Pi's script environment (prelude), source format, declarations, deterministic mode, and tool-search ranking; no agent types"

[dependencies]
# The engine: Cranelift compiles the vendored `engine/quickjs.wasm` as a core
# module; epoch interruption and a store limiter bound each script.
wasmtime.workspace = true
serde_json.workspace = true
# The WASI shim's `random_get` outside deterministic mode.
getrandom.workspace = true
# `Run`: the script thread's event channel and the blocking join when a `Run`
# is dropped on a runtime.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }

[target.'cfg(unix)'.dev-dependencies]
# The signal regression test sends signals to its own process.
libc.workspace = true

[package]
name = "bake-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bake's release tool: packs, signs, rehearses, and verifies native releases. A build tool; it is never shipped."

[[bin]]
name = "bake-release"
path = "src/main.rs"

[dependencies]
# The manifest rules, signature check, archive reader, self-check record,
# version order, and download client a user's `bake update` runs, so every
# release step is checked by the code that will read it.
bake-update.workspace = true
# Ed25519 signing and SHA-256, from the `ring` the workspace already links.
ring.workspace = true
base64.workspace = true
serde_json.workspace = true
toml.workspace = true
flate2.workspace = true
tar.workspace = true
# The live checks reach the download service over the same rustls client
# `bake-update` builds.
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "io-util"] }

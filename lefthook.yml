# Bun owns the workspace; Node remains the agent runtime.
pre-commit:
  jobs:
    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: bun scripts/run-oxlint.ts --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: whitespace (staged)
      run: git diff --cached --check
    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh
pre-push:
  jobs:
    # The static half of `bun run preflight`: generated artifacts, types, lint,
    # and the unit and layout targets, in about 20 seconds. The build, the Node
    # suites, and the PTY scenarios are left to `bun run preflight` before a PR.
    - name: preflight (fast)
      run: bun scripts/preflight.ts --fast
